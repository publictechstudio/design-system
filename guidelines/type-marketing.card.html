<!-- @dsCard group="Type" viewport="700x260" name="Marketing register" subtitle="Big, bold, centred — the studio site" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .l { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }

</style>
<div style="display:flex;flex-direction:column;gap:14px">
  <div><div class="l">hero — 48px / 700</div>
    <div style="font-size:var(--text-hero);font-weight:700;line-height:1.1;color:var(--color-on-surface)">Open Data Projects</div></div>
  <div><div class="l">lede — 20px / 400 / 70% ink</div>
    <div style="font-size:var(--text-lede);line-height:1.6;color:color-mix(in srgb, var(--color-on-surface) 70%, transparent)">Our self-directed projects focused on urbanization and quality of life in African cities.</div></div>
  <div><div class="l">prose — 18px / 400 / 80% ink</div>
    <div style="font-size:var(--text-prose);line-height:1.625;color:color-mix(in srgb, var(--color-on-surface) 80%, transparent)">We create public data products and technology solutions to inform decision-makers across Africa.</div></div>
</div>
