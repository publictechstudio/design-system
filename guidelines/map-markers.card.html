<!-- @dsCard group="Map" viewport="700x170" name="Facility markers" subtitle="Colour by development level; white 1.5px stroke, 0.8 fill" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .lg { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--color-on-surface); }

</style>
<div style="display:flex;flex-direction:column;gap:9px">
  <div class="lg"><svg width="20" height="20"><circle cx="10" cy="10" r="6.5" fill="var(--map-marker-developed)" fill-opacity=".8" stroke="#fff" stroke-width="1.5"/></svg>Developed <span class="v">#1A1A1A</span></div>
  <div class="lg"><svg width="20" height="20"><circle cx="10" cy="10" r="6.5" fill="var(--map-marker-less-developed)" fill-opacity=".8" stroke="#fff" stroke-width="1.5"/></svg>Less developed <span class="v">#8B2000</span></div>
  <div class="lg"><svg width="20" height="20"><circle cx="10" cy="10" r="6.5" fill="var(--map-marker-charter-only)" fill-opacity=".8" stroke="#fff" stroke-width="1.5"/></svg>Charter only — hidden by default <span class="v">#2E7D32</span></div>
  <div class="lg"><svg width="20" height="20"><circle cx="10" cy="10" r="6.5" fill="var(--map-marker-fallback)" fill-opacity=".8" stroke="#fff" stroke-width="1.5"/></svg>Uncategorised — flags bad data <span class="v">#8c00ff</span></div>
  <div class="lg"><svg width="20" height="20"><circle cx="10" cy="10" r="9" fill="var(--map-user-dot)" fill-opacity=".12"/><circle cx="10" cy="10" r="5" fill="var(--map-user-dot)" stroke="#fff" stroke-width="3"/></svg>User location <span class="v">#1976D2 + halo</span></div>
</div>
