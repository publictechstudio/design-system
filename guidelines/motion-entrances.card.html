<!-- @dsCard group="Motion" viewport="700x170" name="Entrance animations" subtitle="fade-in, slide-up, scale-in — the studio's scroll-in set" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .a { width:150px; height:70px; border-radius:var(--radius); background:var(--color-primary); color:#fff;
       display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }

</style>
<div class="row" style="gap:16px">
  <div class="sw" style="width:150px"><div class="a" style="animation:fadeIn .6s ease-in-out infinite alternate">fade-in</div><div class="v">0.6s ease-in-out</div></div>
  <div class="sw" style="width:150px"><div class="a" style="animation:slideUp .8s ease-out infinite alternate">slide-up</div><div class="v">0.8s ease-out, 30px</div></div>
  <div class="sw" style="width:150px"><div class="a" style="animation:scaleIn .5s ease-out infinite alternate">scale-in</div><div class="v">0.5s ease-out, 0.9→1</div></div>
</div>
