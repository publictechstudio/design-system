<!-- @dsCard group="Colors" viewport="700x150" name="Ferry product theme" subtitle="data-theme=\"ferry\" — navy chrome, MD3 blue" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--ferry-navy);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">nav / action</div><div class="v">#012C57</div></div>
  <div class="sw"><div class="chip" style="background:var(--ferry-blue);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">primary</div><div class="v">#1976D2</div></div>
  <div class="sw"><div class="chip" style="background:var(--ferry-blue-dark);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">hover</div><div class="v">#1565C0</div></div>
  <div class="sw"><div class="chip" style="background:var(--ferry-blue-container)"></div><div class="n">container</div><div class="v">#D6E3FF</div></div>
  <div class="sw"><div class="chip" style="background:var(--ferry-surface-variant)"></div><div class="n">surface var</div><div class="v">#DFE2EE</div></div>
  <div class="sw"><div class="chip" style="background:var(--ferry-on-surface);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">on surface</div><div class="v">#1A1B20</div></div>
</div>
