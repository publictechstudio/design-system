<!-- @dsCard group="Type" viewport="700x150" name="Opacity hierarchy" subtitle="The studio grades text by ink opacity, not extra colour tokens" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
</style>
<div style="display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.5">
  <div style="color:var(--color-on-surface)">100% — headings and emphasis</div>
  <div style="color:color-mix(in srgb, var(--color-on-surface) 80%, transparent)">80% — body copy</div>
  <div style="color:color-mix(in srgb, var(--color-on-surface) 70%, transparent)">70% — ledes, card descriptions</div>
  <div style="color:color-mix(in srgb, var(--color-on-surface) 60%, transparent)">60% — copyright, fine print</div>
</div>
