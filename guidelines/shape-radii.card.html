<!-- @dsCard group="Shape" viewport="700x180" name="Radii" subtitle="One radius system-wide — 3.2px, not 8; only chips are round" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .r { width:96px; height:64px; background:var(--color-surface-raised); box-shadow:var(--shadow-card); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--color-on-surface); }

</style>
<div class="row">
  <div class="sw"><div class="r" style="border-radius:var(--radius)">3.2px</div><div class="n">container / control</div><div class="v">--radius (0.2rem)</div></div>
  <div class="sw"><div class="r" style="border-radius:var(--radius-chip)">pill</div><div class="n">label chip</div><div class="v">--radius-chip</div></div>
  <div class="sw" data-theme="ferry"><div class="r" style="border-radius:var(--shape-container)">3.2px</div><div class="n">ferry card</div><div class="v">--shape-container</div></div>
  <div class="sw" data-theme="ferry"><div class="r" style="border-radius:var(--shape-control)">3.2px</div><div class="n">ferry control</div><div class="v">--shape-control</div></div>
</div>
