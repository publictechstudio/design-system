<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--clay-700);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">charter</div><div class="v">#7B3F00</div></div>
  <div class="sw"><div class="chip" style="background:var(--rust-700);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">less developed</div><div class="v">#8B2000</div></div>
  <div class="sw"><div class="chip" style="background:var(--forest-700);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">planned</div><div class="v">#1A6B3C</div></div>
  <div class="sw"><div class="chip" style="background:var(--green-700);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">charter marker</div><div class="v">#2E7D32</div></div>
  <div class="sw"><div class="chip" style="background:#8c00ff;color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">uncategorised</div><div class="v">#8c00ff</div></div>
</div>
