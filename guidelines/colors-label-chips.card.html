<!-- @dsCard group="Colors" viewport="700x120" name="Project label tones" subtitle="Six category pairs — 100 tint behind 700 text" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .lc { display:inline-block; padding:4px 12px; border-radius:var(--radius-chip);
    font-size:var(--text-overline); font-weight:600; text-transform:uppercase;
    letter-spacing:var(--tracking-overline); }

</style>
<div class="row" style="gap:8px">
  <span class="lc" style="background:var(--label-blue-bg);color:var(--label-blue-fg)">Field data collection</span>
  <span class="lc" style="background:var(--label-teal-bg);color:var(--label-teal-fg)">Geospatial data</span>
  <span class="lc" style="background:var(--label-green-bg);color:var(--label-green-fg)">Transit data</span>
  <span class="lc" style="background:var(--label-purple-bg);color:var(--label-purple-fg)">Data visualization</span>
  <span class="lc" style="background:var(--label-orange-bg);color:var(--label-orange-fg)">Civic engagement</span>
  <span class="lc" style="background:var(--label-rose-bg);color:var(--label-rose-fg)">Data journalism</span>
</div>
