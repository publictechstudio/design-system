<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .l { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }

</style>
<div data-theme="ferry" style="display:flex;flex-direction:column;gap:12px">
  <div><div class="l">display-lg — 45/52 / 400</div>
    <div style="font-size:45px;line-height:52px;font-weight:400;color:var(--color-on-surface)">Avoid Lagos traffic.</div></div>
  <div><div class="l">headline-md — 28/36 / 400</div>
    <div style="font-size:28px;line-height:36px;font-weight:400;color:var(--color-on-surface)">The first comprehensive ferry map</div></div>
  <div><div class="l">body-lg — 16/24 / 400</div>
    <div style="font-size:16px;line-height:24px;color:var(--color-on-surface-variant)">Routes, schedules, fares, and terminals in one free, open resource.</div></div>
  <div><div class="l">overline — 12px / 500 / uppercase</div>
    <div style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-overline);color:var(--color-on-surface-variant)">Facility Name</div></div>
</div>
