<!-- @dsCard group="Motion" viewport="700x180" name="Card lift" subtitle="shadow-md → shadow-lg plus a 2px rise, 300ms ease-out — hover me" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .c { width:200px; padding:20px; background:var(--color-surface-raised); border-radius:var(--radius);
       box-shadow:var(--shadow-md); transition:box-shadow 300ms ease-out, transform 300ms ease-out; }
  .c:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
  .t { font-size:14px; font-weight:700; color:var(--color-on-surface); }
  .d { font-size:12px; color:color-mix(in srgb, var(--color-on-surface) 70%, transparent); margin-top:4px; }

</style>
<div class="row" style="gap:20px;padding:8px 0">
  <div class="c"><div class="t">Rest</div><div class="d">shadow-md, no transform</div></div>
  <div class="c" style="box-shadow:var(--shadow-lg);transform:translateY(-2px)"><div class="t">Hover</div><div class="d">shadow-lg, −2px</div></div>
</div>
