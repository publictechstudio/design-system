<!-- @dsCard group="Colors" viewport="700x150" name="Ink & paper" subtitle="Violet-tinted neutrals — never pure grey" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:var(--radius); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; letter-spacing:.01em; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink-900);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">ink 900</div><div class="v">#000000</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-800);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">ink 800</div><div class="v">#1B191F</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-500);color:#fff;display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700">Aa</div><div class="n">ink 500</div><div class="v">#6E6A77</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-300)"></div><div class="n">paper 300</div><div class="v">#E3E0EB</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-200)"></div><div class="n">paper 200</div><div class="v">#E5E1F0</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-50)"></div><div class="n">paper 50</div><div class="v">#FBFAFF</div></div>
</div>
