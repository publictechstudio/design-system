<!-- @dsCard group="Brand" viewport="700x200" name="Logo lockups" subtitle="Horizontal SVG for chrome, stacked PNG for square slots" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .box { padding:18px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center; height:76px; }

</style>
<div class="row">
  <div style="flex:1;min-width:200px">
    <div class="box" style="background:var(--paper-0);box-shadow:var(--shadow-sm)">
      <img src="../assets/logos/public-tech-studio-horiz-black.svg" alt="Public Tech Studio" style="height:40px">
    </div>
    <div class="n">Horizontal, black</div><div class="v">nav — 40px tall</div>
  </div>
  <div style="flex:1;min-width:200px">
    <div class="box" style="background:var(--ink-800)">
      <img src="../assets/logos/public-tech-studio-horiz-white.svg" alt="Public Tech Studio" style="height:40px">
    </div>
    <div class="n">Horizontal, white</div><div class="v">hero over photography</div>
  </div>
  <div style="width:120px">
    <div class="box" style="background:var(--paper-0);box-shadow:var(--shadow-sm)">
      <img src="../assets/logos/public-tech-studio-black-on-white.png" alt="Public Tech Studio" style="height:64px">
    </div>
    <div class="n">Stacked</div><div class="v">square slots</div>
  </div>
</div>
