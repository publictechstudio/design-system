<!-- @dsCard group="Components" viewport="700x300" name="Feedback — Dialog, Panel" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:20px; font-family:var(--font-sans); background:var(--color-surface); }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  .n { font-size:11px; font-weight:700; color:var(--color-on-surface); margin-top:6px; }
  .v { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); }
  
  .lbl { font-family:var(--font-mono); font-size:10px; color:var(--color-on-surface-variant); margin:0 0 6px; }

</style>
<div data-theme="ferry" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div>
    <div class="lbl">Dialog — on a 50% scrim</div>
    <div style="background:var(--scrim);border-radius:var(--radius-md-md);padding:18px;display:flex;justify-content:center">
      <div style="background:var(--color-surface);border-radius:var(--radius-md-xl);box-shadow:var(--shadow-elevation-3);padding:18px;text-align:center;max-width:250px">
        <div style="font-size:16px;font-weight:600;color:var(--color-on-surface);margin-bottom:6px">Did you find what you were looking for?</div>
        <div style="font-size:13px;color:var(--color-on-surface-variant);margin-bottom:14px">Your feedback helps us improve the Lagos Ferry Map.</div>
        <div style="background:var(--color-action);color:#fff;font-size:13px;font-weight:700;padding:8px;border-radius:var(--shape-control);margin-bottom:8px">Share Feedback</div>
        <div style="font-size:13px;color:var(--color-on-surface-variant)">No thanks</div>
      </div>
    </div>
  </div>
  <div>
    <div class="lbl">Panel — 1px edge, drag handle, report action</div>
    <div style="background:var(--color-surface);border:1px solid var(--color-outline-variant);border-radius:var(--radius-md-md);overflow:hidden">
      <div style="display:flex;justify-content:center;padding:8px 0 4px">
        <div style="width:32px;height:4px;border-radius:var(--radius-full);background:color-mix(in srgb,var(--color-on-surface-variant) 30%,transparent)"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px">
        <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-on-surface-variant)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
          Ferry facility
        </span>
        <span style="display:flex;align-items:center;gap:6px">
          <span style="background:var(--color-action);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:var(--shape-control)">Report a data issue</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-on-surface-variant)" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </span>
      </div>
      <div style="padding:10px 12px 16px">
        <div style="font-size:18px;color:var(--color-on-surface)">Ikoyi Jetty</div>
        <div style="font-size:13px;color:var(--color-on-surface-variant);margin-top:4px">Eti-Osa · Terminal · Developed</div>
      </div>
    </div>
  </div>
</div>
