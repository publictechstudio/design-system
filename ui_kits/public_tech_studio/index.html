/* ── The signature brand rule ─────────────────────────────────── */
const BLUE = [66,133,244], GREEN = [34,197,94], YELLOW = [255,235,59];
const mix = (a,b,t) => `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(', ')})`;
function cycleColor(p) {
  const c = (p * 6) % 3;
  if (c <= 1) return mix(BLUE, GREEN, c);
  if (c <= 2) return mix(GREEN, YELLOW, c - 1);
  return mix(YELLOW, BLUE, c - 2);
}
function BrandRule() {
  const [color, setColor] = useState(() => cycleColor(0));
  useEffect(() => {
    const read = () => {
      const max = document.body.scrollHeight - window.innerHeight;
      setColor(cycleColor(Math.min(window.scrollY / (max || 1), 1)));
    };
    read();
    window.addEventListener('scroll', read, { passive: true });
    return () => window.removeEventListener('scroll', read);
  }, []);
  return <div aria-hidden style={{ height: 6, background: color }} />;
}

           background: 'var(--scrim)', display: 'flex', alignItems: 'center',
           justifyContent: 'center', padding: 16 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: 'var(--color-surface-raised)',
             borderRadius: 'var(--radius)', boxShadow: 'var(--shadow-2xl)', padding: 24,
             maxWidth: width, width: '100%', maxHeight: '80vh', overflowY: 'auto',
             position: 'relative', animation: 'scaleIn .5s ease-out' }}>
        <button onClick={onClose} aria-label="Close" style={{ position: 'absolute', top: 16,
               right: 16, border: 'none', background: 'none', cursor: 'pointer',
               color: 'var(--color-on-surface-variant)' }}>
          <Glyph d={ICONS.close} size={20} />
        </button>
        {children}
      </div>
    </div>
  );
}

function App() {
  const [project, setProject] = useState(null);
  const [subscribe, setSubscribe] = useState(false);
  return (
    <>
      <Nav onSubscribe={() => setSubscribe(true)} />
      <Hero />
      <Work />
      <Services />
      <Projects onRead={setProject} />
      <Newsletter />
      <About />
      <Contact />
      <Footer />

      {project && (
        <Modal onClose={() => setProject(null)}>
          <h3 style={{ margin: '0 24px 12px 0', fontSize: 'var(--text-card-title)',
                 fontWeight: 600, color: 'var(--color-on-surface)' }}>{project.title}</h3>
          <p style={{ margin: '0 0 16px', fontSize: 14, fontWeight: 500,
                 color: 'var(--color-primary)' }}>{project.tagline}</p>
          <p style={{ margin: '0 0 16px', lineHeight: 1.625,
                 color: 'color-mix(in srgb, var(--color-on-surface) 70%, transparent)' }}>
            {project.description}
          </p>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
            {project.labels.map(([text, tone]) => (
              <span key={text} className="lc" style={LABEL_STYLE(tone)}>{text}</span>
            ))}
          </div>
          {project.href && (
            <a className="btn" href={project.href} target="_blank" rel="noopener noreferrer">
              View Product<Glyph d={ICONS.external} size={16} />
            </a>
          )}
        </Modal>
      )}

      {subscribe && (
        <Modal onClose={() => setSubscribe(false)} width={480}>
          <h3 style={{ margin: '0 24px 8px 0', fontSize: 'var(--text-card-title)',
                 fontWeight: 600, color: 'var(--color-on-surface)' }}>Subscribe to Our Newsletter</h3>
          <p style={{ margin: '0 0 16px',
                 color: 'color-mix(in srgb, var(--color-on-surface) 70%, transparent)' }}>
            Stay updated on our latest data projects and civic tech insights.
          </p>
          <div style={{ display: 'flex', gap: 8 }}>
            <input placeholder="Type your email…" style={{ flex: 1, padding: '10px 12px',
                   border: '1px solid var(--color-outline-variant)', borderRadius: 'var(--radius)',
                   fontFamily: 'var(--font-sans)', fontSize: 14, background: 'var(--paper-100)' }} />
            <button className="btn" onClick={() => setSubscribe(false)}>Subscribe</button>
          </div>
        </Modal>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
